<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Bloch-plane view of the AI-PO-OVM: a Lissajous orbit inside a square of half-width 0.8, with corner lobes lying outside the unit disc where the third effect has a negative eigenvalue.</h2>
<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg"><title>Bloch plane orbit of E2</title><desc>Quasiperiodic Lissajous orbit with frequency ratio root two, leaving the unit disc in four corner lobes.</desc>
<path d="M204 94 H396 V286 H204 Z M180 190 a120 120 0 1 0 240 0 a120 120 0 1 0 -240 0" fill="#F0997B" fill-opacity="0.35" fill-rule="evenodd" stroke="none"/>
<circle cx="300" cy="190" r="120" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="204" y="94" width="192" height="192" fill="none" stroke="#888780" stroke-width="0.5"/>
<line x1="160" y1="190" x2="440" y2="190" stroke="#888780" stroke-width="0.5"/>
<line x1="300" y1="50" x2="300" y2="330" stroke="#888780" stroke-width="0.5"/>
<path id="orb" fill="none" stroke="#7F77DD" stroke-width="1" opacity="0.85"/>
<circle id="dot" cx="396" cy="190" r="5" fill="#D85A30"/>
<text class="ts" x="446" y="190" dominant-baseline="central">a = ⟨σx⟩ →</text>
<text class="ts" x="308" y="62" dominant-baseline="central">b = ⟨σy⟩ ↑</text>
<text class="ts" x="446" y="100" dominant-baseline="central">unit disc: E₂ ⪰ 0</text>
<text class="ts" x="446" y="122" dominant-baseline="central">lobes: E₂ has λ &lt; 0</text>
<text class="ts" x="446" y="144" dominant-baseline="central">box: |a|,|b| ≤ r = 0.8</text>
<text class="ts" x="446" y="238" dominant-baseline="central">orbit: ω₁/ω₀ = √2</text>
<text class="ts" x="446" y="260" dominant-baseline="central">dense on the 2-torus</text>
</svg>
<div style="display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--text-secondary)">
<span style="min-width:14px">t</span>
<input type="range" id="ts" min="0" max="1256" value="0" style="flex:1">
<span id="rd" style="min-width:190px;text-align:right;font-family:var(--font-mono)">λ_min(E₂) = 0.067</span>
</div>
<script>
(function(){
var R=120,cx=300,cy=190,r=0.8;
var d="";for(var i=0;i<=4000;i++){var t=i*4*Math.PI/4000;var a=r*Math.cos(t),b=r*Math.sin(Math.SQRT2*t);d+=(i?"L":"M")+(cx+a*R).toFixed(1)+" "+(cy-b*R).toFixed(1)+" ";}
document.getElementById("orb").setAttribute("d",d);
var s=document.getElementById("ts"),dot=document.getElementById("dot"),rd=document.getElementById("rd");
function up(){var t=s.value/100;var a=r*Math.cos(t),b=r*Math.sin(Math.SQRT2*t);
dot.setAttribute("cx",(cx+a*R).toFixed(1));dot.setAttribute("cy",(cy-b*R).toFixed(1));
var n=Math.hypot(a,b),lm=(1-n)/3;
rd.textContent="λ_min(E₂) = "+lm.toFixed(3);
rd.style.color=lm<0?"var(--text-danger)":"var(--text-secondary)";}
s.addEventListener("input",up);up();})();
</script>
