* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #ccc; font-family: 'Georgia', 'Times New Roman', serif; overflow: hidden; height: 100vh; }

#selector-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;

  padding: 8px 16px; display: flex; gap: 6px; flex-wrap: wrap;

.sys-btn:hover { background: #252540; color: #ccc; border-color: #555; }
.sys-btn.active { background: #2a2040; color: #fff; border-color: #8866cc; }

#hud {
  position: absolute; top: 60px; left: 16px; z-index: 10;
  background: rgba(10,10,20,0.88); border: 1px solid #2a2a3a;
  padding: 16px 20px; max-width: 380px; border-radius: 4px;
}
#hud h2 { font-size: 1.1rem; color: #fff; margin-bottom: 8px; letter-spacing: 1px; }
#hud .tuple {

  letter-spacing: 2px; margin: 8px 0; word-break: break-all;
}
#hud .metric { margin: 6px 0; font-size: 0.9rem; color: #aaa; }
#hud .metric .label { color: #888; }
#hud .metric .val { color: #66ccff; font-family: monospace; margin-left: 6px; }
#hud .metric .val.neg { color: #ff6666; }
#hud .metric .val.pos { color: #66ff99; }
#hud .badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 0.75rem; margin-right: 4px; font-weight: bold;
}
.badge-psd { background: #1a3a1a; color: #66ff99; border: 1px solid #336633; }
.badge-indef { background: #3a1a1a; color: #ff6666; border: 1px solid #663333; }
.badge-static { background: #1a1a2e; color: #8888cc; border: 1px solid #333366; }

.badge-complete { background: #1a2e1a; color: #88cc88; border: 1px solid #336633; }
.badge-paracomp { background: #2e2e1a; color: #cccc88; border: 1px solid #666633; }

#time-controls {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(10,10,20,0.9); border: 1px solid #333;
  padding: 8px 16px; border-radius: 4px; display: flex; gap: 10px; align-items: center;

#time-controls button {

#time-controls button:hover { background: #252540; }
#time-controls button.active { background: #2a2040; border-color: #8866cc; }
#time-controls input[type=range] { width: 80px; }

#info-footer {

  font-size: 0.7rem; color: #555;

#info-footer a { color: #666; text-decoration: none; }

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;

// Bloch sphere
const sphereGeo = new THREE.EdgesGeometry(new THREE.SphereGeometry(1, 64, 64));
const sphereMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.5 });
scene.add(new THREE.LineSegments(sphereGeo, sphereMat));

// Tetrahedral Bloch vectors (unit)
const TETRA = [
  new THREE.Vector3(0, 0, 1),
  new THREE.Vector3(2*Math.sqrt(2)/3, 0, -1/3),
  new THREE.Vector3(-Math.sqrt(2)/3, Math.sqrt(6)/3, -1/3),
  new THREE.Vector3(-Math.sqrt(2)/3, -Math.sqrt(6)/3, -1/3)
];

// Colors
const COLORS = [0x00ffff, 0xff00ff, 0xffff00, 0xffffff]; // cyan, magenta, yellow, white

// Dynamic objects
let arrows = [], trailLines = [], trails = [[],[],[],[]];
const maxTrail = 500;
// ═══════════════════════════════════════════
// CLEAR / BUILD VISUALIZATION
// ═══════════════════════════════════════════

function clearScene() {
  arrows.forEach(a => scene.remove(a));
  trailLines.forEach(l => scene.remove(l));
  arrows = []; trailLines = []; trails = [[],[],[],[]];
}

function buildTetrahedral(sys) {
  clearScene();
  const n = sys.bloch_norm;
  for (let i = 0; i < 4; i++) {
    const v = TETRA[i].clone().multiplyScalar(n);
    const arrow = new THREE.ArrowHelper(
      v.clone().normalize(), new THREE.Vector3(0,0,0), n,
      COLORS[i], 0.08, 0.04
    );
    scene.add(arrow);
    arrows.push(arrow);

    const geo = new THREE.BufferGeometry();
    const mat = new THREE.LineBasicMaterial({ color: COLORS[i], transparent: true, opacity: 0.6 });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    trailLines.push(line);
    trails[i] = [];
  }
}

function buildAIPOOVM(sys) {
  clearScene();
  const r = sys.bloch_norm;
  const colors3 = [0x00ffff, 0xff00ff, 0xffff00];
  for (let i = 0; i < 3; i++) {
    const v = new THREE.Vector3(0, 0, 0);
    if (i === 0) v.set(r, 0, 0);
    else if (i === 1) v.set(0, 0, 0);
    else v.set(-r, 0, 0);
    
    const len = v.length();
    if (len > 0.001) {
      const arrow = new THREE.ArrowHelper(v.clone().normalize(), new THREE.Vector3(0,0,0), len, colors3[i], 0.08, 0.04);
      scene.add(arrow);
      arrows.push(arrow);
    } else {
      const dotGeo = new THREE.SphereGeometry(0.03, 8, 8);
      const dotMat = new THREE.MeshBasicMaterial({ color: colors3[i] });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      scene.add(dot);
      arrows.push(dot);
    }

    const geo = new THREE.BufferGeometry();
    const mat = new THREE.LineBasicMaterial({ color: colors3[i], transparent: true, opacity: 0.6 });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    trailLines.push(line);
    trails[i] = [];
  }
}

function buildDefault(sys) {
  clearScene();
  const m = sys.m || 4;
  const cols = [0x00ffff, 0xff00ff, 0xffff00, 0xffffff];
  for (let i = 0; i < m; i++) {
    const phi = i * Math.PI * 2 / m;
    const theta = Math.PI / 3;
    const v = new THREE.Vector3(
      Math.sin(theta) * Math.cos(phi),
      Math.sin(theta) * Math.sin(phi),
      Math.cos(theta)
    );
    const dotGeo = new THREE.SphereGeometry(0.05, 16, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: cols[i] });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.copy(v);
    scene.add(dot);
    arrows.push(dot);
    trails[i] = []; trailLines.push(null);
  }
}

function buildVisualization(sys) {
  if (sys.tetrahedral) buildTetrahedral(sys);
  else if (sys.anticommuting) buildAIPOOVM(sys);
  else buildDefault(sys);
}
// ═══════════════════════════════════════════
// HUD UPDATE
// ═══════════════════════════════════════════

function updateHUD(sys) {
  document.getElementById('sys-name').textContent = sys.name;
  document.getElementById('sys-tuple').textContent = sys.tuple;

  let badges = '';
  if (sys.positivity === '+') badges += '<span class="badge badge-psd">PSD</span>';
  else badges += '<span class="badge badge-indef">INDEF</span>';
  if (sys.dynamics === 'static') badges += '<span class="badge badge-static">STATIC</span>';
  else badges += '<span class="badge badge-osc">OSCILLATING</span>';
  if (sys.completeness === 'IC') badges += '<span class="badge badge-complete">COMPLETE</span>';
  else badges += '<span class="badge badge-paracomp">PARACOMPLETE</span>';
  if (sys.tier) badges += ' <span style="color:#ffcc66;font-size:0.75rem;">'+sys.tier+'</span>';
  document.getElementById('sys-badges').innerHTML = badges;

  let metrics = '';
  metrics += '<div class="metric"><span class="label">Symmetry:</span><span class="val">'+sys.symmetry+'</span></div>';
  metrics += '<div class="metric"><span class="label">Operators m:</span><span class="val">'+sys.m+'</span></div>';
  if (sys.bloch_norm !== null)
    metrics += '<div class="metric"><span class="label">Bloch norm n:</span><span class="val">'+sys.bloch_norm.toFixed(2)+'</span></div>';
  if (sys.eigenvalues)
    metrics += '<div class="metric"><span class="label">Eigenvalues:</span><span class="val '+(sys.eigenvalues[0]<0?'neg':'pos')+'">['+sys.eigenvalues.map(v=>v.toFixed(2)).join(', ')+']</span></div>';
  if (sys.cross_overlap !== null)
    metrics += '<div class="metric"><span class="label">Cross-overlap:</span><span class="val">'+sys.cross_overlap.toFixed(4)+'</span></div>';
  if (sys.grammar_distance !== null)
    metrics += '<div class="metric"><span class="label">Grammar dist:</span><span class="val">'+sys.grammar_distance.toFixed(2)+'</span></div>';
  metrics += '<div class="metric" style="margin-top:8px;color:#777;font-size:0.8rem;">'+sys.description+'</div>';
  document.getElementById('sys-metrics').innerHTML = metrics;
}

// ═══════════════════════════════════════════
// SYSTEM SWITCHING
// ═══════════════════════════════════════════

function switchSystem(key) {
  currentSys = key;
  const sys = SYSTEMS[key];
  updateHUD(sys);
  buildVisualization(sys);
  simTime = 0;

  document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-sys="'+key+'"]').classList.add('active');

  if (sys.oscillating) {
    playing = true;
    document.getElementById('btn-play').classList.add('active');
    document.getElementById('btn-pause').classList.remove('active');
  } else {
    playing = false;
    document.getElementById('btn-play').classList.remove('active');
    document.getElementById('btn-pause').classList.add('active');
  }
}

document.querySelectorAll('.sys-btn').forEach(btn => {
  btn.addEventListener('click', () => switchSystem(btn.dataset.sys));
});
// ═══════════════════════════════════════════
// TIME CONTROLS
// ═══════════════════════════════════════════

document.getElementById('btn-play').addEventListener('click', () => {
  playing = true;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
});
document.getElementById('btn-pause').addEventListener('click', () => {
  playing = false;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-pause').classList.add('active');
});
document.getElementById('speed-slider').addEventListener('input', (e) => {
  speed = parseFloat(e.target.value);
  document.getElementById('speed-label').textContent = speed.toFixed(1)+'\u00D7';
});

// ═══════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const dt = clock.getDelta();
  const sys = SYSTEMS[currentSys];
  
  if (playing && sys.oscillating) {
    simTime += dt * speed;
    
    if (sys.tetrahedral) {
      const q0 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), w0 * simTime);
      const q1 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), w1 * simTime);
      const q2 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), w2 * simTime);
      const R = new THREE.Quaternion().copy(q0).multiply(q1).multiply(q2);
      const n = sys.bloch_norm;
      
      for (let i = 0; i < 4; i++) {
        const v = TETRA[i].clone().applyQuaternion(R).multiplyScalar(n);
        scene.remove(arrows[i]);
        const arrow = new THREE.ArrowHelper(v.clone().normalize(), new THREE.Vector3(0,0,0), n, COLORS[i], 0.08, 0.04);
        scene.add(arrow);
        arrows[i] = arrow;
        
        trails[i].push(v.clone());
        if (trails[i].length > maxTrail) trails[i].shift();
        if (trailLines[i]) trailLines[i].geometry.setFromPoints(trails[i]);
      }
    } else if (sys.anticommuting) {
      const r = sys.bloch_norm;
      const a = r * Math.cos(w0 * simTime);
      const b = r * Math.sin(w1 * simTime);
      const vecs = [
        new THREE.Vector3(a, 0, 0),
        new THREE.Vector3(0, b, 0),
        new THREE.Vector3(-a, -b, 0)
      ];
      
      for (let i = 0; i < 3; i++) {
        const v = vecs[i];
        const len = v.length();
        scene.remove(arrows[i]);
        if (len > 0.005) {
          const arrow = new THREE.ArrowHelper(v.clone().normalize(), new THREE.Vector3(0,0,0), len, [0x00ffff,0xff00ff,0xffff00][i], 0.08, 0.04);
          scene.add(arrow);
          arrows[i] = arrow;
        } else {
          const dotGeo = new THREE.SphereGeometry(0.03, 8, 8);
          const dotMat = new THREE.MeshBasicMaterial({ color: [0x00ffff,0xff00ff,0xffff00][i] });
          const dot = new THREE.Mesh(dotGeo, dotMat);
          scene.add(dot);
          arrows[i] = dot;
        }
        
        trails[i].push(v.clone());
        if (trails[i].length > maxTrail) trails[i].shift();
        if (trailLines[i]) trailLines[i].geometry.setFromPoints(trails[i]);
      }
    }
  }
  
  document.getElementById('time-display').textContent = 't = ' + simTime.toFixed(3);
  
  controls.update();
  renderer.render(scene, camera);
}
// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  const keys = ['1','2','3','4','5','6','7','8','9','0','-','=','q','w','e','r','t'];
  const sysKeys = ['sic_povm','sic_novm','sic_o_povm','sic_o_novm','ai_cpovm','a_pc_povm','s_pc_povm','am_pc_povm','ai_novm','ai_po_ovm','a_po_povm','s_po_povm','sic_npovm','ai_cnovm','ai_ic_novm','ai_ic_povm','a_pc_povm_grid'];
  const idx = keys.indexOf(e.key);
  if (idx >= 0) switchSystem(sysKeys[idx]);
  if (e.key === ' ') { e.preventDefault(); playing = !playing; 
    document.getElementById('btn-play').classList.toggle('active', playing);
    document.getElementById('btn-pause').classList.toggle('active', !playing);
  }
});

// Start
switchSystem('sic_povm');
animate();
</script>
</body>
</html>
